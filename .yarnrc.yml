enableGlobalCache: false
enableScripts: true
globalFolder: .yarn/global
nodeLinker: node-modules
npmMinimalAgeGate: 0
yarnPath: .yarn/releases/yarn-4.18.0.cjs

packageExtensions:
  "next-auth@*":
    peerDependencies:
      "@simplewebauthn/browser": "*"
  "@auth/core@*":
    peerDependencies:
      "@simplewebauthn/browser": "*"
